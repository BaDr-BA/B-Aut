# اسم الروبوت أو العملية الآلية
name: Generate Content Plans Weekly

# متى يعمل هذا الروبوت؟
on:
  # 1. للتشغيل اليدوي (يمكنك الضغط على زر لتشغيله في أي وقت)
  workflow_dispatch:

  # 2. للتشغيل المجدول (تلقائيًا)
  schedule:
    # يعمل مرة كل أسبوع (يوم الأحد الساعة 3 صباحًا بتوقيت UTC)
    # يمكنك تعديل التوقيت كما تشاء باستخدام صيغة Cron
    - cron: '0 3 * * 0'

# ما هي المهام التي سيقوم بها الروبوت؟
jobs:
  build-and-run:
    # سيستخدم الروبوت نظام تشغيل Ubuntu (نظام مجاني وسريع)
    runs-on: ubuntu-latest

    steps:
      # الخطوة 1: يقوم الروبوت بتنزيل نسخة من كود المستودع
      - name: Checkout repository
        uses: actions/checkout@v4

      # الخطوة 2: يقوم الروبوت بتثبيت لغة بايثون
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10' # يمكن استخدام أي إصدار حديث

      # الخطوة 3: يقوم الروبوت بتثبيت المكتبات التي يحتاجها السكريبت
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-generativeai PyGithub

      # الخطوة 4: يقوم الروبوت بتشغيل السكريبت الخاص بنا
      - name: Run the script to generate plans
        run: python generate_plan.py
        env:
          # هنا، نعطي السكريبت المفاتيح التي حفظناها في "خزنة الأسرار"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY_1: ${{ secrets.GEMINI_API_KEY_1 }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
          GEMINI_API_KEY_5: ${{ secrets.GEMINI_API_KEY_5 }}
          GEMINI_API_KEY_6: ${{ secrets.GEMINI_API_KEY_6 }}

      # الخطوة 5 (اختيارية لكن مهمة): يقوم الروبوت بحفظ التغييرات
      # إذا قام السكريبت بإنشاء أو تحديث أي ملف، هذه الخطوة ترفعه للمستودع
      - name: Commit and push changes
        run: |
          git config --global user.name 'GitHub Actions Bot'
          git config --global user.email 'actions@github.com'
          git add .
          # التحقق إذا كانت هناك تغييرات لعمل commit
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "docs: Auto-update content plans"
            git push
          fi
