name: Auto Writer & Publisher

on:
  workflow_dispatch:  # تشغيل يدوي
  schedule:
    - cron: '0 */12 * * *'  # كل 12 ساعات

permissions:      # <--- هذا هو الجزء الناقص المهم جداً
  contents: write # <--- هذا يعطي البوت صلاحية التعديل والرفع

jobs:
  write-post:
    runs-on: ubuntu-latest
    timeout-minutes: 420  # 7 ساعات (زيادة أمان)
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'  # تسريع التثبيت
          
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          
      - name: Run Writer Script
        id: write_article
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
          BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
        run: |
          python write_article.py 2>&1 | tee output.log
          
      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: error-logs
          path: output.log
          retention-days: 7
          
      - name: Commit changes
        if: success()
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          
          # 1. نخبي التغييرات الحالية مؤقتاً
          git stash
          
          # 2. نسحب الجديد من المستودع
          git pull origin main --rebase
          
          # 3. نرجع التغييرات بتاعتنا تاني
          git stash pop || echo "No stash to pop"
          
          # 4. نضيف الملفات المهمة فقط (تجاهل اللوج)
          git add plans/ published_titles.txt last_key_index.txt
          
          # 5. نرفع التغييرات
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Auto: Article published $(date +'%Y-%m-%d %H:%M')"
            git push origin main
          fi
